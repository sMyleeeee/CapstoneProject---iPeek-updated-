<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPeek — Research Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden;">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">i</div>
      Research Repository
    </div>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="profile.html" class="avatar" id="avatarEl" title="View Profile"></a>
      <span class="role-pill" id="rolePill"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="layout-two">

    <a class="back-link" href="browse.html">← Back to Browse</a>

    <!-- Paper info card -->
    <div class="card" style="margin-bottom:14px;">
      <div class="paper-title" id="paperTitle">Loading...</div>
      <div class="paper-meta" id="paperMeta"></div>
      <div class="meta-chips" id="metaChips"></div>
    </div>

    <!-- Abstract card -->
    <div class="card" style="margin-bottom:14px;">
      <div class="section-label">Abstract</div>
      <div class="abstract-text" id="abstractText">Loading...</div>
    </div>

    <!-- Full-document card — restored from the old #pdfViewerTrigger slot.
         Shown ONLY when the author gave submission-time public_pdf_consent;
         otherwise hidden (remote viewers get the IMRaD card below instead). -->
    <div class="card" id="pdfViewerTrigger" style="display:none;margin-bottom:14px;">
      <button class="btn btn-accent btn-full" onclick="readFullVersion()">
        📄 Read Full Version
      </button>
    </div>

    <!-- IMRaD card — occupies the slot where the full-document viewer
         (#pdfViewerCard) used to render. Shown ONLY when the author did
         NOT give public_pdf_consent: remote viewers see the IMRaD summary
         instead of the full PDF. Hidden entirely when consent was given.
         Sits BETWEEN the Abstract and the AI refine bar. -->
    <div class="card" id="imradViewerCard" style="display:none;margin-bottom:14px;">
      <div class="section-label">IMRaD Summary</div>
      <p class="text-muted text-sm" style="margin-bottom:10px;">
        The author did not permit remote viewing of the full PDF — this
        AI-generated summary is shown instead. The complete document
        remains available in-person at the Library Viewing Station.
      </p>
      <div class="ai-box" id="imradBox">
        <div style="display:flex;align-items:center;gap:8px;color:var(--muted);">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- AI refine bar -->
    <div class="card refine-bar" style="margin-bottom:14px;">
      <div class="refine-row">
        <select id="refineTarget" class="form-input refine-select">
          <option value="auto">Auto (active tab)</option>
          <option value="similarity">Similarity</option>
          <option value="summary">Summary</option>
          <option value="gap">Gap</option>
        </select>
        <input id="refineInput" class="form-input refine-input" placeholder="Ask AI to expand or refocus the analysis...">
        <button id="refineBtn" class="btn btn-accent" onclick="refineAnalysis()">Refine</button>
      </div>
    </div>

    <!-- AI Analysis card -->
    <div class="ai-analysis-card" style="margin-bottom:14px;">
      <div class="analysis-header">
        <h3>AI Analysis</h3>
        <span class="badge badge-pending" id="analysisStatus">Running...</span>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('similarity',this)">Similarity Report</button>
        <button class="tab-btn" onclick="switchTab('summary',this)">AI Summary</button>
        <button class="tab-btn" onclick="switchTab('gaps',this)">Research Gap</button>
      </div>

      <div id="tabSimilarity">
        <div id="simBars">
          <div style="display:flex;align-items:center;gap:8px;padding:20px;color:var(--muted);justify-content:center;">
            <div class="spinner"></div>
          </div>
        </div>
        <!-- Citation badges rendered here by detail.js -->
        <div class="citation-badges" id="citationBadges"></div>
      </div>

      <div id="tabSummary" style="display:none;">
        <div class="ai-box" id="summaryBox">
          <div style="display:flex;align-items:center;gap:8px;color:var(--muted);">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <div id="tabGaps" style="display:none;">
        <div class="ai-box" id="gapsBox">
          <div style="display:flex;align-items:center;gap:8px;color:var(--muted);">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="js/page-fade.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pillnav.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/detail.js"></script>

  <script>
    async function logout() {
      try { await apiLogout(); } catch {}
      sessionStorage.clear();
      window.location.replace("index.html");
    }
  </script>
</body>
</html>
