<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPeek — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden;">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">i</div>
      Research Repository
    </div>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="profile.html" class="avatar" id="avatarEl" title="View Profile"></a>
      <span class="role-pill" id="rolePill"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="profile-layout">
    <!-- Left column: avatar card -->
    <div>
      <div class="profile-avatar-card">
        <div class="avatar-large" id="avatarLarge" title="Click to change photo">
          <span id="avatarInitials"></span>
          <div class="avatar-edit">✏️</div>
        </div>
        <div class="profile-name" id="profileName"></div>
        <div class="profile-email" id="profileEmail"></div>
        <span class="role-pill" id="profileRolePill"></span>
        <div class="profile-meta">
          <div class="profile-meta-item">🏛️ <strong id="metaUniv">ISAT-U</strong></div>
          <div class="profile-meta-item">🪪 <strong id="metaId">—</strong></div>
          <div class="profile-meta-item">📅 <strong>Member since 2019</strong></div>
          <div class="profile-meta-item">📄 <strong id="metaPapers">0</strong> validated papers</div>
        </div>
      </div>
    </div>

    <!-- Right column: settings form -->
    <div>
      <div class="profile-form-card">
        <div class="section-title">Personal Information</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input class="form-input" id="firstName" placeholder="First name">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input class="form-input" id="lastName" placeholder="Last name">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input class="form-input" id="email" type="email" placeholder="email@isat-u.edu.ph">
          </div>
          <div class="form-group">
            <label class="form-label">Contact Number</label>
            <input class="form-input" id="contact" placeholder="+63 9XX XXX XXXX">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Department</label>
          <select class="form-input" id="department">
            <option>Library Services</option>
            <option>College of Engineering</option>
            <option>College of Computing</option>
            <option>College of Arts &amp; Sciences</option>
            <option>IT Department</option>
          </select>
        </div>

        <hr class="divider">

        <div class="section-title">Change Password</div>

        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input class="form-input" id="currentPw" type="password" placeholder="Enter current password">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input class="form-input" id="newPw" type="password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
            <div class="pw-bar">
              <div class="pw-segment" id="pwSeg1"></div>
              <div class="pw-segment" id="pwSeg2"></div>
              <div class="pw-segment" id="pwSeg3"></div>
            </div>
            <div class="pw-label" id="pwLabel"></div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input class="form-input" id="confirmPw" type="password" placeholder="Repeat new password">
          </div>
        </div>

        <!-- Desktop save/cancel -->
        <div class="form-actions-right profile-actions-desktop">
          <button class="btn btn-ghost" onclick="cancelChanges()">Cancel</button>
          <button class="btn btn-primary" onclick="saveChanges()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile sticky bottom bar -->
  <div class="profile-actions-sticky">
    <button class="btn btn-ghost" onclick="cancelChanges()">Cancel</button>
    <button class="btn btn-primary" onclick="saveChanges()">Save Changes</button>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="js/api.js"></script>
  <script src="js/pillnav.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/profile.js"></script>

  <script>
    async function logout() {
      try { await apiLogout(); } catch {}
      sessionStorage.clear();
      window.location.replace("index.html");
    }
  </script>
</body>
</html>
