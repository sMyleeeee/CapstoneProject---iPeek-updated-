<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPeek — My Submissions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden;">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">i</div>
      Research Repository
    </div>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="profile.html" class="avatar" id="avatarEl" title="View Profile"></a>
      <span class="role-pill" id="rolePill"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="layout-two">
    <div class="hero mb-md">
      <div>
        <h2>My Submissions</h2>
        <p>Track the status of research you've submitted</p>
      </div>
    </div>

    <div id="subList"></div>

    <div id="empty" class="empty-state" style="display:none;">
      <div class="empty-state-icon">📭</div>
      <p>You haven't submitted any research yet.</p>
      <button class="btn btn-primary mt-md" onclick="location.href='upload.html'">
        Submit Your First Paper
      </button>
    </div>

    <div id="loading" class="text-center" style="padding:60px 0;color:var(--muted);">
      <div class="spinner spinner-lg" style="margin:0 auto 12px;"></div>
      <p>Loading your submissions...</p>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="js/api.js"></script>
  <script src="js/pillnav.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/my-submissions.js"></script>

  <script>
    async function logout() {
      try { await apiLogout(); } catch {}
      sessionStorage.clear();
      window.location.replace("index.html");
    }
  </script>
</body>
</html>
