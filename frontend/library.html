<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPeek — Library Viewing Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden;">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">i</div>
      Research Repository
    </div>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="profile.html" class="avatar" id="avatarEl" title="View Profile"></a>
      <span class="role-pill" id="rolePill"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="main" style="max-width:1100px;margin:0 auto;">

    <div class="hero">
      <div>
        <h2>Library Viewing Station</h2>
        <p>Full research papers — available on this terminal only</p>
      </div>
    </div>

    <!-- PDF viewer (relocated from detail.html) — opens when a paper is selected -->
    <div class="card" id="pdfViewerCard" style="display:none;margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;">
        <h3 style="font-size:0.9rem;" id="viewerTitle">Document Viewer</h3>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn btn-ghost btn-sm" onclick="pdfPrevPage()" id="pdfPrevBtn">‹ Prev</button>
          <span id="pdfPageInfo" style="font-size:0.78rem;color:var(--muted);">Page — / —</span>
          <button class="btn btn-ghost btn-sm" onclick="pdfNextPage()" id="pdfNextBtn">Next ›</button>
          <button class="btn btn-ghost btn-sm" onclick="hidePdfViewer()">✕ Close</button>
        </div>
      </div>
      <div style="background:var(--bg);border-radius:var(--radius);overflow:hidden;text-align:center;padding:4px;">
        <canvas id="pdfCanvas" style="max-width:100%;display:block;margin:0 auto;"></canvas>
      </div>
      <div id="pdfError" style="display:none;padding:20px;text-align:center;color:var(--danger);font-size:0.84rem;"></div>
    </div>

    <div class="search-wrap mb-md">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Title, author, keyword, or technology...">
    </div>

    <div class="results-bar">
      <span id="resultsCount">Loading...</span>
    </div>

    <div class="research-grid" id="grid"></div>

    <div id="empty" class="empty-state" style="display:none;">
      <div class="empty-state-icon">📭</div>
      <p>No research found. Try a different search.</p>
    </div>

    <div id="loading" class="text-center" style="padding:60px 0;color:var(--muted);">
      <div class="spinner spinner-lg" style="margin:0 auto 12px;"></div>
      <p>Loading repository...</p>
    </div>
  </div>

  <!-- Mobile PDF full-screen overlay (relocated from detail.html) -->
  <div class="pdf-overlay" id="pdfOverlay">
    <div class="pdf-overlay-header">
      <span style="font-weight:600;font-size:0.9rem;" id="viewerTitleOv">Document Viewer</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="pdfPrevPage()" id="pdfPrevBtnOv">‹ Prev</button>
        <span id="pdfPageInfoOv" style="font-size:0.78rem;color:var(--muted);">Page — / —</span>
        <button class="btn btn-ghost btn-sm" onclick="pdfNextPage()" id="pdfNextBtnOv">Next ›</button>
        <button class="btn btn-ghost btn-sm" onclick="closePdfOverlay()">✕ Close</button>
      </div>
    </div>
    <div class="pdf-overlay-body">
      <canvas id="pdfCanvasOverlay" style="max-width:100%;display:block;"></canvas>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="js/page-fade.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pillnav.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/library.js"></script>

  <script>
    async function logout() {
      try { await apiLogout(); } catch {}
      sessionStorage.clear();
      window.location.replace("index.html");
    }
  </script>
</body>
</html>
