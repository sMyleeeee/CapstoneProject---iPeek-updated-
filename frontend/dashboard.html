<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPeek — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="visibility:hidden;">
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">i</div>
      Research Repository
    </div>
    <div class="nav-links"></div>
    <div class="nav-right">
      <a href="profile.html" class="avatar" id="avatarEl" title="View Profile"></a>
      <span class="role-pill" id="rolePill"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="main" style="max-width:1100px;margin:0 auto;">

    <div class="mb-lg">
      <p class="text-muted greeting-sub">Good morning,</p>
      <h2 id="greeting"></h2>
    </div>

    <!-- Stat cards — uses class for mobile horizontal scroll -->
    <div class="stat-grid stat-grid-mobile">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-lbl">Total Research</div>
      </div>
      <div class="stat-card hi">
        <div class="stat-num" id="statPending">—</div>
        <div class="stat-lbl">Pending Review</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statValidated">—</div>
        <div class="stat-lbl">Validated</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statRejected">—</div>
        <div class="stat-lbl">Rejected</div>
      </div>
    </div>

    <div class="dash-grid">
      <div class="card">
        <div class="card-header-row">
          <h3>Recent Submissions</h3>
          <a href="review.html" class="view-all-link">View all →</a>
        </div>
        <div id="recentList"></div>
      </div>

      <div class="card">
        <h3 class="mb-md">Quick Actions</h3>
        <div class="action-alert">
          <div class="action-alert-title">Action Required</div>
          <div class="action-alert-body" id="pendingMsg">Loading...</div>
        </div>
        <div class="quick-actions">
          <button class="btn btn-primary" onclick="location.href='review.html'">Validate Research</button>
          <button class="btn btn-ghost" onclick="location.href='upload.html'">Upload Study</button>
          <button class="btn btn-ghost" onclick="location.href='browse.html'">Search Repo</button>
          <button class="btn btn-ghost" onclick="location.href='profile.html'">Edit Profile</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="js/api.js"></script>
  <script src="js/pillnav.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/dashboard.js"></script>

  <script>
    async function logout() {
      try { await apiLogout(); } catch {}
      sessionStorage.clear();
      window.location.replace("index.html");
    }
  </script>
</body>
</html>
